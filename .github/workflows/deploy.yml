name: Deploy to Railway

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements_vault.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install Supabase dependencies for migration script
          pip install "psycopg[binary,pool]"
          # Install bot dependencies
          pip install -r requirements_vault.txt
          
      - name: Run tests
        run: |
          pytest tests/ -v
          
      - name: Check syntax
        run: |
          python -m py_compile bot.py
          python -m py_compile handlers/*.py
          python -m py_compile processing/*.py
          python -m py_compile tasks.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python for Pre-Deployment
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Railway CLI
        run: npm i -g @railway/cli
          
      - name: Run Pre-Deployment Checks
        run: |
          chmod +x ./scripts/deploy.sh
          ./scripts/deploy.sh
        env:
          # These secrets are needed for the pre-deployment script to run migrations
          BOT_TOKEN: ${{ secrets.BOT_TOKEN_DUMMY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL_DUMMY }}

      - name: Deploy to Railway
        # The --detach flag returns control to the workflow immediately
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          
      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed"
          fi